name: Python Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile all .py
        run: |
          python -m compileall -q .

      - name: Run smoke tests
        run: |
          python -m pytest tests/ -v

      - name: Verify README assets
        run: |
          test -f README.md
          test -f README.zh-CN.md
          test -f LICENSE
          test -f .gitignore
          test -f diagram_1_arch.png
          test -f diagram_2_sim2real_flow.png
          test -f diagram_3_mindmap.png
          test -f 工业视觉_sim2real_技术方案.md
          echo "All assets present"